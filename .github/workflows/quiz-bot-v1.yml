name: Quiz Video Bot v2

on:
  schedule:
    # Video time (IST): 04:00 AM / 12:00 PM / 05:00 PM.   (IST = UTC + 5:30)
    # GitHub ka cron kabhi late ya skip ho jaata hai, isliye har video ke liye 11 trigger hain:
    #  - target se pehle wale (primary): video bana ke target time tak ruk-te hain aur EXACT time par bhejte hain
    #  - target ke baad wale (backup): sirf tab video banate hain jab pehle wale ne bheja na ho
    # Jo pehla chal gaya wahi bhejta hai, baaki slot-log.json dekh ke 1 minute me skip ho jaate hain.
    # Cron ka time script khud pehchanta hai - cron badlo to kuch aur badalna nahi padta.
    # --- 04:00 IST ---
    - cron: '13 21 * * *'
    - cron: '28 21 * * *'
    - cron: '43 21 * * *'
    - cron: '58 21 * * *'
    - cron: '13 22 * * *'
    - cron: '38 22 * * *'
    - cron: '53 22 * * *'
    - cron: '8 23 * * *'
    - cron: '23 23 * * *'
    - cron: '53 23 * * *'
    - cron: '23 0 * * *'
    # --- 12:00 IST ---
    - cron: '13 5 * * *'
    - cron: '28 5 * * *'
    - cron: '43 5 * * *'
    - cron: '58 5 * * *'
    - cron: '13 6 * * *'
    - cron: '38 6 * * *'
    - cron: '53 6 * * *'
    - cron: '8 7 * * *'
    - cron: '23 7 * * *'
    - cron: '53 7 * * *'
    - cron: '23 8 * * *'
    # --- 17:00 IST ---
    - cron: '13 10 * * *'
    - cron: '28 10 * * *'
    - cron: '43 10 * * *'
    - cron: '58 10 * * *'
    - cron: '13 11 * * *'
    - cron: '38 11 * * *'
    - cron: '53 11 * * *'
    - cron: '8 12 * * *'
    - cron: '23 12 * * *'
    - cron: '53 12 * * *'
    - cron: '23 13 * * *'
  workflow_dispatch:        # Actions tab se "Run workflow" dabake abhi test kar sakte ho
    inputs:
      slot:
        description: 'Khali chhodo = turant bhejo. Ya slot likho: 04:00 / 12:00 / 17:00 (us time tak ruk ke bhejega)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: quiz-video-bot
  cancel-in-progress: false

jobs:
  make-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Code download
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check - is slot ka video pehle hi ja chuka?
        id: chk
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
          SEND_SLOT: ${{ github.event.inputs.slot }}
        run: node make-quiz-v2.mjs --check-slot

      - name: ffmpeg + fonts install
        if: steps.chk.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji || sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Playwright + Chromium install
        if: steps.chk.outputs.skip != 'true'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Video banao aur Telegram pe bhejo
        if: steps.chk.outputs.skip != 'true'
        env:
          # Secrets set nahi hain to make-quiz-v2.mjs ke upar wale DEFAULT values use honge
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ElevenLabs keys: awaaz band hai, isliye abhi use nahi hoti
          ELEVENLABS_KEYS: ${{ secrets.ELEVENLABS_KEYS }}
          # kaun sa cron / slot chala - isse script ko target time pata chalta hai
          SCHEDULE_CRON: ${{ github.event.schedule }}
          SEND_SLOT: ${{ github.event.inputs.slot }}
        run: node make-quiz-v2.mjs

      - name: Sawal history + slot nishan save karo
        if: steps.chk.outputs.skip != 'true' && success()
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add quiz-state.json
          if [ -f slot-log.json ]; then git add slot-log.json; fi
          if git diff --cached --quiet; then
            echo "state me koi change nahi"
          else
            git commit -m "quiz state update"
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
              echo "push retry $i"; sleep 5
            done
          fi
