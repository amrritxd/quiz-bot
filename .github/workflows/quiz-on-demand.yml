name: Quiz On-Demand Button

on:
  schedule:
    - cron: '*/5 * * * *'     # har 5 min Telegram me "🎬 Abhi video" button check (GitHub kabhi late kar deta hai)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: quiz-on-demand-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Code download
        uses: actions/checkout@v4

      - name: Button dabaya gaya?
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node on-demand.mjs

      - name: Request ka nishan save karo
        if: steps.poll.outputs.changed == 'true'
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add request-log.json
          git commit -m "on-demand request log" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
            echo "push retry $i"; sleep 5
          done

      - name: Video workflow chalao (turant bhejo mode)
        if: steps.poll.outputs.request == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run quiz-bot-v1.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
